<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RunCoach — Plataforma do Aluno</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{background:#0A0A0F;font-family:'Manrope',sans-serif;color:#F0F0F8}
    select option{background:#16161F}
    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:#0A0A0F}
    ::-webkit-scrollbar-thumb{background:#222230;border-radius:3px}
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.2}}
    @keyframes spin{to{transform:rotate(360deg)}}
    @keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
    @keyframes slideIn{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:translateX(0)}}
    @keyframes ping{0%{transform:scale(1);opacity:1}75%,100%{transform:scale(2);opacity:0}}
    .fade-in{animation:fadeIn .4s ease forwards}
    .slide-in{animation:slideIn .3s ease forwards}
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef, useCallback } = React;

const C = {
  bg:"#0A0A0F", surface:"#11111A", card:"#181820", border:"#222232",
  orange:"#FF6B35", orangeD:"#FF3D00", blue:"#4B7BFF", green:"#2ECC71",
  yellow:"#F1C40F", red:"#E74C3C", purple:"#9B59B6",
  text:"#F0F0F8", muted:"#5A5A78", light:"#9090B8",
};

const ZONES = [
  {bg:"rgba(46,204,113,.10)",border:"rgba(46,204,113,.25)",color:"#2ECC71",name:"Recuperação",desc:"Muito leve"},
  {bg:"rgba(52,152,219,.10)",border:"rgba(52,152,219,.25)",color:"#3498DB",name:"Base",desc:"Leve"},
  {bg:"rgba(241,196,15,.10)",border:"rgba(241,196,15,.25)",color:"#F1C40F",name:"Aeróbico",desc:"Moderado"},
  {bg:"rgba(231,76,60,.10)",border:"rgba(231,76,60,.25)",color:"#E74C3C",name:"Limiar",desc:"Difícil"},
  {bg:"rgba(155,89,182,.10)",border:"rgba(155,89,182,.25)",color:"#9B59B6",name:"VO₂ Máx",desc:"Máximo"},
];

// ─── FIREBASE REALTIME DATABASE SYNC ──────────────────────────
async function fbGet(dbUrl) {
  const res = await fetch(dbUrl + "/runcoach.json");
  if (!res.ok) throw new Error("Erro ao ler dados");
  const data = await res.json();
  return data || {alunos:{}, planos:{}, progresso:{}, config:{}};
}

async function fbPatch(dbUrl, patchFn) {
  // Lê, aplica patch, escreve — com retry simples
  for(let attempt=0; attempt<3; attempt++){
    try {
      const latest = await fbGet(dbUrl);
      const updated = patchFn(latest);
      const res = await fetch(dbUrl + "/runcoach.json", {
        method:"PUT",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify(updated)
      });
      if(!res.ok) throw new Error("Write failed");
      return await res.json();
    } catch(e){
      if(attempt===2) throw e;
      await new Promise(r=>setTimeout(r,500*(attempt+1)));
    }
  }
}
// ─── SHARED UI ────────────────────────────────────────────────
const s = {
  card:(x={})=>({background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:20,...x}),
  input:{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"12px 14px",
    color:C.text,fontSize:14,outline:"none",width:"100%",fontFamily:"inherit",transition:"border-color .2s"},
  label:{fontSize:11,fontWeight:700,letterSpacing:"1.5px",textTransform:"uppercase",
    color:C.muted,marginBottom:5,display:"block"},
  btn:(v="primary")=>({
    display:"inline-flex",alignItems:"center",justifyContent:"center",gap:8,
    padding:"13px 22px",borderRadius:10,border:"none",cursor:"pointer",
    fontFamily:"inherit",fontSize:14,fontWeight:700,transition:"all .2s",
    ...(v==="primary"?{background:`linear-gradient(135deg,${C.orange},${C.orangeD})`,
      color:"#fff",boxShadow:"0 6px 20px rgba(255,107,53,.3)"}:
    v==="ghost"?{background:C.card,color:C.light,border:`1px solid ${C.border}`}:
    v==="success"?{background:"linear-gradient(135deg,#2ECC71,#27AE60)",color:"#fff",boxShadow:"0 6px 20px rgba(46,204,113,.3)"}:
    v==="danger"?{background:"rgba(231,76,60,.12)",color:C.red,border:`1px solid rgba(231,76,60,.3)`}:
    {background:"rgba(46,204,113,.12)",color:C.green,border:"1px solid rgba(46,204,113,.3)"}),
  }),
};

function Field({label,required,hint,error,children}){
  return(
    <div style={{display:"flex",flexDirection:"column",gap:4}}>
      <label style={s.label}>{label}{required&&<span style={{color:C.orange}}> *</span>}</label>
      {children}
      {hint&&<span style={{fontSize:11,color:C.muted}}>{hint}</span>}
      {error&&<span style={{fontSize:11,color:C.red}}>{error}</span>}
    </div>
  );
}

function Inp({type="text",placeholder,min,max,value,onChange,disabled,style={}}){
  const [f,setF]=useState(false);
  return(
    <input type={type} placeholder={placeholder} min={min} max={max} value={value} onChange={onChange}
      disabled={disabled} onFocus={()=>setF(true)} onBlur={()=>setF(false)}
      style={{...s.input,borderColor:f?C.orange:C.border,boxShadow:f?"0 0 0 3px rgba(255,107,53,.1)":"none",
        opacity:disabled?.6:1,...style}}/>
  );
}

function Sel({value,onChange,options,placeholder}){
  const [f,setF]=useState(false);
  return(
    <select value={value} onChange={onChange} onFocus={()=>setF(true)} onBlur={()=>setF(false)}
      style={{...s.input,borderColor:f?C.orange:C.border,boxShadow:f?"0 0 0 3px rgba(255,107,53,.1)":"none",
        appearance:"none",cursor:"pointer"}}>
      <option value="">{placeholder||"Selecione..."}</option>
      {options.map(o=><option key={o.v} value={o.v}>{o.l}</option>)}
    </select>
  );
}

function Chip({label,selected,onClick}){
  return(
    <div onClick={onClick} style={{padding:"7px 14px",borderRadius:20,cursor:"pointer",fontSize:12,fontWeight:600,
      border:`1px solid ${selected?C.orange:C.border}`,
      background:selected?"rgba(255,107,53,.15)":C.card,
      color:selected?C.orange:C.light,transition:"all .15s"}}>
      {label}
    </div>
  );
}

function Notify({msg,type}){
  if(!msg)return null;
  return(
    <div style={{position:"fixed",top:20,right:20,zIndex:9999,padding:"12px 20px",borderRadius:10,fontSize:13,fontWeight:600,
      background:type==="success"?"rgba(46,204,113,.95)":type==="error"?"rgba(231,76,60,.95)":"rgba(75,123,255,.95)",
      color:"#fff",boxShadow:"0 8px 24px rgba(0,0,0,.5)",animation:"fadeIn .3s ease",maxWidth:340}}>{msg}</div>
  );
}

// ─── CONEXÃO COM O ESPAÇO DO PROFESSOR ───────────────────────
function ConexaoScreen({onConnect}){
  const [dbUrl,setDbUrl]=useState("");
  const [nome,setNome]=useState("");
  const [email,setEmail]=useState("");
  const [senha,setSenha]=useState("");
  const [err,setErr]=useState("");
  const [loading,setLoading]=useState(false);
  const [step,setStep]=useState("espaco"); // espaco | conta

  const conectarEspaco = async () => {
    const url = dbUrl.trim().replace(/\/+$/, "");
    if(!url){setErr("Cole a URL do Firebase fornecida pelo professor.");return;}
    if(!url.includes("firebaseio.com")){setErr("URL inválida. Deve conter firebaseio.com");return;}
    setLoading(true); setErr("");
    try {
      const data = await fbGet(url);
      if(!data || typeof data !== "object") throw new Error("inválido");
      setStep("conta");
    } catch(e){ setErr("Não foi possível conectar. Verifique a URL com seu professor."); }
    setLoading(false);
  };

  const criarConta = async () => {
    if(!nome.trim()||!email.trim()||senha.length<6){
      setErr("Preencha nome, e-mail e senha (mín. 6 caracteres)."); return;
    }
    if(!email.includes("@")){setErr("E-mail inválido.");return;}
    setLoading(true); setErr("");
    try {
      const url = dbUrl.trim().replace(/\/+$/, "");
      const uid = email.toLowerCase().replace(/[^a-z0-9]/g,"_")+"_"+Date.now().toString(36);
      const cfg = {dbUrl:url, uid, nome:nome.trim(), email:email.trim(), senha};
      try{localStorage.setItem("runcoach_aluno_session",JSON.stringify(cfg));}catch{}
      onConnect(cfg);
    } catch(e){ setErr("Erro ao criar conta. Tente novamente."); }
    setLoading(false);
  };  return(
    <div style={{minHeight:"100vh",background:C.bg,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
      <div style={{width:"100%",maxWidth:440}}>
        <div style={{textAlign:"center",marginBottom:32}}>
          <div style={{width:56,height:56,borderRadius:14,background:`linear-gradient(135deg,${C.orange},${C.orangeD})`,
            display:"inline-flex",alignItems:"center",justifyContent:"center",fontSize:28,
            boxShadow:"0 10px 28px rgba(255,107,53,.4)",marginBottom:14}}>🏃</div>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:26,fontWeight:800,letterSpacing:1}}>
            Run<span style={{color:C.orange}}>Coach</span>
          </div>
          <div style={{fontSize:11,color:C.muted,letterSpacing:"2px",textTransform:"uppercase",marginTop:3}}>
            Plataforma do Aluno
          </div>
        </div>

        <div style={s.card({padding:26})}>
          {step==="espaco"&&(
            <>
              <div style={{fontFamily:"'Syne',sans-serif",fontSize:17,fontWeight:800,marginBottom:6}}>
                Conectar ao seu professor
              </div>
              <div style={{fontSize:13,color:C.light,lineHeight:1.6,marginBottom:18}}>
                Peça ao professor a <strong style={{color:C.orange}}>URL do Firebase</strong> e cole abaixo.
              </div>
              <div style={{marginBottom:14}}>
                <Field label="URL do Firebase (fornecida pelo professor)" hint="Ex: https://meu-projeto-abc-default-rtdb.firebaseio.com">
                  <Inp placeholder="https://meu-projeto-default-rtdb.firebaseio.com"
                    value={dbUrl} onChange={e=>setDbUrl(e.target.value)}
                    style={{fontFamily:"monospace",fontSize:11}}/>
                </Field>
              </div>
              {err&&<div style={{fontSize:12,color:C.red,background:"rgba(231,76,60,.1)",
                border:"1px solid rgba(231,76,60,.25)",borderRadius:8,padding:"10px 12px",marginBottom:12}}>{err}</div>}
              <button style={{...s.btn("primary"),width:"100%"}} onClick={conectarEspaco} disabled={loading}>
                {loading?"Verificando...":"Conectar →"}
              </button>
            </>
          )}

          {step==="conta"&&(
            <>
              <div style={{fontFamily:"'Syne',sans-serif",fontSize:17,fontWeight:800,marginBottom:6}}>
                Criar sua conta
              </div>
              <div style={{fontSize:13,color:C.light,marginBottom:18,lineHeight:1.6}}>
                Conectado com sucesso! Crie sua conta de aluno.
              </div>
              <div style={{display:"flex",flexDirection:"column",gap:12,marginBottom:14}}>
                <Field label="Seu Nome">
                  <Inp placeholder="João Silva" value={nome} onChange={e=>setNome(e.target.value)}/>
                </Field>
                <Field label="E-mail">
                  <Inp type="email" placeholder="joao@email.com" value={email} onChange={e=>setEmail(e.target.value)}/>
                </Field>
                <Field label="Senha" hint="Mínimo 6 caracteres">
                  <Inp type="password" placeholder="••••••••" value={senha} onChange={e=>setSenha(e.target.value)}/>
                </Field>
              </div>
              {err&&<div style={{fontSize:12,color:C.red,background:"rgba(231,76,60,.1)",
                border:"1px solid rgba(231,76,60,.25)",borderRadius:8,padding:"10px 12px",marginBottom:12}}>{err}</div>}
              <button style={{...s.btn("orange"),width:"100%"}} onClick={criarConta} disabled={loading}>
                {loading?"Criando...":"🏃 Entrar no RunCoach →"}
              </button>
              <button style={{...s.btn("ghost"),width:"100%",marginTop:8,fontSize:11}}
                onClick={()=>{setStep("espaco");setErr("");}}>← Voltar</button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

  return(
    <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:36}}>
      <div style={{width:44,height:44,borderRadius:12,background:`linear-gradient(135deg,${C.orange},${C.orangeD})`,
        display:"flex",alignItems:"center",justifyContent:"center",fontSize:22,boxShadow:"0 8px 24px rgba(255,107,53,.35)"}}>🏃</div>

// ─── STEP NAV ────────────────────────────────────────────────
function StepNav({step,setStep,completed}){
  const steps=["Perfil","Teste 3km","Zonas FC","Meus Treinos"];
  return(
    <div style={{display:"flex",background:C.surface,border:`1px solid ${C.border}`,borderRadius:14,overflow:"hidden",marginBottom:36}}>
      {steps.map((name,i)=>(
        <button key={i} onClick={()=>{if(i<=completed)setStep(i);}}
          style={{flex:1,padding:"13px 6px",border:"none",borderRight:i<3?`1px solid ${C.border}`:"none",
            background:step===i?C.card:"transparent",color:step===i?C.orange:i<completed?C.green:C.muted,
            cursor:i<=completed?"pointer":"default",fontFamily:"inherit",fontSize:10,fontWeight:700,
            letterSpacing:".5px",textTransform:"uppercase",lineHeight:1.3}}>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:20,fontWeight:800,display:"block",marginBottom:3}}>
            {i<completed?"✓":`0${i+1}`}
          </div>
          {name}
        </button>
      ))}
    </div>
  );
}

// ─── STEP 1: PERFIL ──────────────────────────────────────────
function StepPerfil({initialData,onNext}){
  const def=initialData||{};
  const [form,setForm]=useState({
    nome:def.nome||"",email:def.email||"",idade:def.idade||"",sexo:def.sexo||"",
    peso:def.peso||"",altura:def.altura||"",nivel:def.nivel||"",
    dias:def.dias||"",objetivo:def.objetivo||"",tempo:def.tempo||"",obs:def.obs||""
  });
  const [saude,setSaude]=useState(def.saude||[]);
  const [local,setLocal]=useState(def.local||[]);
  const [errors,setErrors]=useState({});
  const set=(k,v)=>setForm(f=>({...f,[k]:v}));
  const toggle=(arr,setArr,val)=>setArr(a=>a.includes(val)?a.filter(x=>x!==val):[...a,val]);
  const validate=()=>{
    const e={};
    if(!form.nome.trim())e.nome="Obrigatório";
    if(!form.idade)e.idade="Obrigatório";
    if(!form.peso)e.peso="Obrigatório";
    if(!form.altura)e.altura="Obrigatório";
    if(!form.nivel)e.nivel="Obrigatório";
    if(!form.dias)e.dias="Obrigatório";
    if(!form.objetivo)e.objetivo="Obrigatório";
    setErrors(e); return Object.keys(e).length===0;
  };
  const submit=()=>{
    if(!validate())return;
    const imc=(parseFloat(form.peso)/Math.pow(parseFloat(form.altura)/100,2)).toFixed(1);
    onNext({...form,imc,saude,local,fcMaxFormula:220-parseInt(form.idade)});
  };
  const saudeOpts=["Nenhuma","Hipertensão","Diabetes","Cardiopatia","Joelho","Lombar","Asma","Sobrepeso"];
  const localOpts=["Rua / calçada","Parque","Esteira","Pista de atletismo","Trilha"];
  return(
    <div className="fade-in">
      <h2 style={{fontFamily:"'Syne',sans-serif",fontSize:"clamp(26px,6vw,38px)",fontWeight:800,lineHeight:1.1,marginBottom:8}}>
        Informações <span style={{color:C.orange}}>Pessoais</span>
      </h2>
      <p style={{color:C.light,fontSize:14,marginBottom:28,lineHeight:1.6}}>Preencha seus dados. Eles serão enviados ao seu professor.</p>
      <div style={{fontSize:10,fontWeight:700,letterSpacing:"2px",textTransform:"uppercase",color:C.muted,marginBottom:12}}>Dados Pessoais</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
        <Field label="Nome completo" required error={errors.nome}><Inp placeholder="Maria Silva" value={form.nome} onChange={e=>set("nome",e.target.value)}/></Field>
        <Field label="E-mail"><Inp type="email" placeholder="maria@email.com" value={form.email} onChange={e=>set("email",e.target.value)}/></Field>
        <Field label="Idade" required error={errors.idade}><Inp type="number" placeholder="30" min="10" max="99" value={form.idade} onChange={e=>set("idade",e.target.value)}/></Field>
        <Field label="Sexo"><Sel value={form.sexo} onChange={e=>set("sexo",e.target.value)} options={[{v:"M",l:"Masculino"},{v:"F",l:"Feminino"}]}/></Field>
        <Field label="Peso (kg)" required error={errors.peso}><Inp type="number" placeholder="70" min="30" max="300" value={form.peso} onChange={e=>set("peso",e.target.value)}/></Field>
        <Field label="Altura (cm)" required error={errors.altura}><Inp type="number" placeholder="170" min="100" max="250" value={form.altura} onChange={e=>set("altura",e.target.value)}/></Field>
      </div>
      <div style={{borderTop:`1px solid ${C.border}`,margin:"20px 0"}}/>
      <div style={{fontSize:10,fontWeight:700,letterSpacing:"2px",textTransform:"uppercase",color:C.muted,marginBottom:12}}>Histórico & Objetivo</div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:14}}>
        <Field label="Nível atual" required error={errors.nivel}>
          <Sel value={form.nivel} onChange={e=>set("nivel",e.target.value)} options={[
            {v:"sedentario",l:"Sedentário"},{v:"iniciante",l:"Iniciante"},{v:"recreativo",l:"Recreativo"},
            {v:"intermediario",l:"Intermediário"},{v:"avancado",l:"Avançado"}]}/>
        </Field>
        <Field label="Dias disponíveis/semana" required error={errors.dias}>
          <Sel value={form.dias} onChange={e=>set("dias",e.target.value)} options={[
            {v:"2",l:"2 dias"},{v:"3",l:"3 dias"},{v:"4",l:"4 dias"},{v:"5",l:"5 dias"},{v:"6",l:"6 dias"}]}/>
        </Field>
        <Field label="Objetivo principal" required error={errors.objetivo}>
          <Sel value={form.objetivo} onChange={e=>set("objetivo",e.target.value)} options={[
            {v:"5k",l:"Completar 5km"},{v:"10k",l:"Completar 10km"},{v:"21k",l:"Meia maratona"},
            {v:"42k",l:"Maratona"},{v:"emagrecer",l:"Emagrecer / saúde"},{v:"melhorar_tempo",l:"Melhorar tempo"}]}/>
        </Field>
        <Field label="Tempo disponível/treino">
          <Sel value={form.tempo} onChange={e=>set("tempo",e.target.value)} options={[
            {v:"30",l:"~30 min"},{v:"45",l:"~45 min"},{v:"60",l:"~60 min"},{v:"90",l:"~90 min"}]}/>
        </Field>
      </div>
      <Field label="Condições de saúde">
        <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:4}}>
          {saudeOpts.map(o=><Chip key={o} label={o} selected={saude.includes(o)} onClick={()=>toggle(saude,setSaude,o)}/>)}
        </div>
      </Field>
      <div style={{marginTop:16}}>
        <Field label="Onde costuma treinar">
          <div style={{display:"flex",flexWrap:"wrap",gap:8,marginTop:4}}>
            {localOpts.map(o=><Chip key={o} label={o} selected={local.includes(o)} onClick={()=>toggle(local,setLocal,o)}/>)}
          </div>
        </Field>
      </div>
      <div style={{marginTop:16}}>
        <Field label="Observações adicionais">
          <textarea value={form.obs} onChange={e=>set("obs",e.target.value)}
            placeholder="Lesões antigas, metas específicas, restrições de horário..."
            style={{...s.input,resize:"vertical",minHeight:80}}/>
        </Field>
      </div>
      <div style={{marginTop:28}}>
        <button style={{...s.btn("primary"),width:"100%"}} onClick={submit}>Continuar para o Teste de 3km →</button>
      </div>
    </div>
  );
}

// ─── STEP 2: TESTE 3KM ───────────────────────────────────────
function StepTeste({aluno,initialData,onNext,onBack}){
  const def=initialData||{};
  const [tMin,setTMin]=useState(def.tMin||"");
  const [tSeg,setTSeg]=useState(def.tSeg||"");
  const [fcMaxReal,setFcMaxReal]=useState(def.fcMaxReal||"");
  const [fcRepouso,setFcRepouso]=useState(def.fcRepouso||"");
  const [timer,setTimer]=useState(0);
  const [running,setRunning]=useState(false);
  const [errors,setErrors]=useState({});
  const [showGuide,setShowGuide]=useState(false);
  const ref=useRef(null);
  useEffect(()=>{if(running){ref.current=setInterval(()=>setTimer(t=>t+1),1000);}else{clearInterval(ref.current);}return()=>clearInterval(ref.current);},[running]);
  const fmt=()=>{const h=Math.floor(timer/3600).toString().padStart(2,"0");const m=Math.floor((timer%3600)/60).toString().padStart(2,"0");const sc=(timer%60).toString().padStart(2,"0");return`${h}:${m}:${sc}`;};
  const stopFill=()=>{setRunning(false);if(!tMin)setTMin(String(Math.floor(timer/60)));if(!tSeg)setTSeg(String(timer%60));};
  const min=parseInt(tMin)||0, seg=parseInt(tSeg)||0, totalSeg=min*60+seg;
  const paceSeg=totalSeg>0?totalSeg/3:0;
  const paceStr=paceSeg>0?`${Math.floor(paceSeg/60)}:${Math.round(paceSeg%60).toString().padStart(2,"0")}`:"--:--";
  const fcMax=fcMaxReal?parseInt(fcMaxReal):aluno.fcMaxFormula;
  const fcRep=fcRepouso?parseInt(fcRepouso):60;
  const reserva=fcMax-fcRep;
  const zona=(p1,p2)=>({min:Math.round(fcRep+reserva*p1),max:Math.round(fcRep+reserva*p2)});
  const validate=()=>{const e={};if(!tMin&&!tSeg&&timer===0)e.tempo="Informe o tempo";if(!fcRepouso)e.fcRepouso="Obrigatório";setErrors(e);return Object.keys(e).length===0;};
  const submit=()=>{
    if(!validate())return;
    const zonas={z1:zona(.5,.6),z2:zona(.6,.7),z3:zona(.7,.8),z4:zona(.8,.9),z5:zona(.9,1)};
    onNext({tMin:String(min),tSeg:String(seg),totalSeg,fcRepouso:fcRep,fcMaxReal:parseInt(fcMaxReal)||0,fcMax,reserva,paceStr,zonas});
  };
  return(
    <div className="fade-in">
      <h2 style={{fontFamily:"'Syne',sans-serif",fontSize:"clamp(26px,6vw,38px)",fontWeight:800,lineHeight:1.1,marginBottom:8}}>Teste de <span style={{color:C.orange}}>3 km</span></h2>
      <p style={{color:C.light,fontSize:14,marginBottom:20,lineHeight:1.6}}>Corra 3km no seu melhor ritmo sustentável. Registre o tempo e sua FC ao final.</p>
      <div style={{background:"rgba(255,107,53,.06)",border:"1px solid rgba(255,107,53,.2)",borderRadius:12,marginBottom:20,overflow:"hidden"}}>
        <button onClick={()=>setShowGuide(!showGuide)} style={{width:"100%",padding:"14px 18px",background:"none",border:"none",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",fontFamily:"inherit",color:C.orange,fontWeight:700,fontSize:13}}>
          <span>📋 Como realizar o Teste de 3km</span>
          <span style={{transform:showGuide?"rotate(180deg)":"none",transition:"transform .3s"}}>▼</span>
        </button>
        {showGuide&&(
          <div style={{padding:"0 18px 18px",animation:"fadeIn .3s ease",borderTop:"1px solid rgba(255,107,53,.2)",paddingTop:16}}>
            {["Aqueça por 15–20 min: caminhada, trote leve e exercícios dinâmicos.",
              "Corra 3km no ritmo mais forte que consegue sustentar do início ao fim.",
              "Não comece muito rápido — mantenha o ritmo constante.",
              "Ao cruzar os 3km, meça sua FC imediatamente. Esta é sua FC Máxima Real.",
              "Mida FC de Repouso pela manhã, antes de levantar da cama."
            ].map((txt,i)=>(
              <div key={i} style={{display:"flex",gap:10,marginBottom:8,alignItems:"flex-start"}}>
                <span style={{color:C.orange,fontWeight:800,flexShrink:0}}>{i+1}.</span>
                <span style={{fontSize:13,color:C.light,lineHeight:1.5}}>{txt}</span>
              </div>
            ))}
          </div>
        )}
      </div>
      <div style={s.card({marginBottom:20,textAlign:"center",padding:"28px 20px"})}>
        <div style={{fontSize:11,color:C.muted,letterSpacing:"2px",textTransform:"uppercase",marginBottom:12}}>Cronômetro do Teste</div>
        <div style={{fontFamily:"'Syne',sans-serif",fontSize:56,fontWeight:800,letterSpacing:4,color:running?C.orange:C.text,transition:"color .3s",textShadow:running?"0 0 30px rgba(255,107,53,.4)":"none"}}>{fmt()}</div>
        <div style={{display:"flex",gap:10,justifyContent:"center",marginTop:16}}>
          {!running?<button style={s.btn("primary")} onClick={()=>setRunning(true)}>▶ Iniciar</button>:
            <button style={{...s.btn("danger"),padding:"12px 22px",fontSize:14,fontWeight:700,border:"none"}} onClick={stopFill}>⏹ Parar e registrar</button>}
          <button style={s.btn("ghost")} onClick={()=>{setRunning(false);setTimer(0);}}>Resetar</button>
        </div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:16}}>
        <Field label="Tempo — Minutos" error={errors.tempo}><Inp type="number" placeholder="18" min="10" max="60" value={tMin} onChange={e=>setTMin(e.target.value)}/></Field>
        <Field label="Tempo — Segundos"><Inp type="number" placeholder="30" min="0" max="59" value={tSeg} onChange={e=>setTSeg(e.target.value)}/></Field>
        <Field label="FC ao final do teste (bpm)"><Inp type="number" placeholder="185" min="100" max="230" value={fcMaxReal} onChange={e=>setFcMaxReal(e.target.value)}/></Field>
        <Field label="FC de repouso (bpm)" required error={errors.fcRepouso} hint="Pela manhã antes de levantar"><Inp type="number" placeholder="60" min="30" max="100" value={fcRepouso} onChange={e=>setFcRepouso(e.target.value)}/></Field>
      </div>
      {paceSeg>0&&(
        <div style={{background:"rgba(255,107,53,.08)",border:"1px solid rgba(255,107,53,.2)",borderRadius:10,padding:"12px 16px",marginBottom:16,display:"flex",gap:12,alignItems:"center"}}>
          <span style={{fontFamily:"'Syne',sans-serif",fontSize:28,fontWeight:800,color:C.orange}}>{paceStr}</span>
          <span style={{fontSize:13,color:C.muted}}>min/km · Pace estimado</span>
        </div>
      )}
      <div style={{display:"flex",gap:10,marginTop:24}}>
        <button style={{...s.btn("ghost"),flex:1}} onClick={onBack}>← Voltar</button>
        <button style={{...s.btn("primary"),flex:2}} onClick={submit}>Ver minhas Zonas de FC →</button>
      </div>
    </div>
  );
}

// ─── STEP 3: ZONAS FC ────────────────────────────────────────
function StepZonas({aluno,teste,onNext,onBack}){
  const zonaData=[teste.zonas.z1,teste.zonas.z2,teste.zonas.z3,teste.zonas.z4,teste.zonas.z5];
  return(
    <div className="fade-in">
      <h2 style={{fontFamily:"'Syne',sans-serif",fontSize:"clamp(26px,6vw,38px)",fontWeight:800,lineHeight:1.1,marginBottom:8}}>
        Suas Zonas de <span style={{color:C.orange}}>FC</span>
      </h2>
      <p style={{color:C.light,fontSize:14,marginBottom:20,lineHeight:1.6}}>Calculadas com Método Karvonen a partir dos seus dados reais.</p>
      <div style={s.card({textAlign:"center",padding:"28px 16px",marginBottom:16,background:C.surface})}>
        <div style={{fontSize:11,letterSpacing:"2px",textTransform:"uppercase",color:C.muted,marginBottom:8}}>FC Máxima</div>
        <div style={{fontFamily:"'Syne',sans-serif",fontSize:80,fontWeight:800,lineHeight:1,color:C.orange}}>{teste.fcMax}</div>
        <div style={{fontSize:14,color:C.muted,marginTop:4}}>bpm</div>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:12,marginBottom:20}}>
        {[{label:"FC Repouso",value:`${teste.fcRepouso} bpm`,color:C.blue},{label:"Reserva FC",value:`${teste.reserva} bpm`,color:C.green},{label:"Pace 3km",value:teste.paceStr,color:C.orange}].map(({label,value,color})=>(
          <div key={label} style={s.card({textAlign:"center",padding:"14px 10px"})}>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:26,fontWeight:800,color,lineHeight:1}}>{value}</div>
            <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginTop:4}}>{label}</div>
          </div>
        ))}
      </div>
      <div style={{fontSize:10,fontWeight:700,letterSpacing:"2px",textTransform:"uppercase",color:C.muted,marginBottom:12}}>5 Zonas de Treinamento</div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(5,1fr)",gap:10,marginBottom:20}}>
        {ZONES.map((zs,i)=>(
          <div key={i} style={{background:zs.bg,border:`1px solid ${zs.border}`,borderRadius:12,padding:"14px 8px",textAlign:"center",color:zs.color}}>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:28,fontWeight:800,lineHeight:1}}>Z{i+1}</div>
            <div style={{fontSize:9,fontWeight:700,letterSpacing:"1px",textTransform:"uppercase",margin:"5px 0 8px",opacity:.85}}>{zs.name}</div>
            <div style={{fontSize:12,fontWeight:700}}>{zonaData[i].min}–{zonaData[i].max}</div>
            <div style={{fontSize:10,opacity:.7,marginTop:3}}>{zs.desc}</div>
          </div>
        ))}
      </div>
      <div style={{background:"rgba(75,123,255,.08)",border:"1px solid rgba(75,123,255,.2)",borderRadius:10,padding:"12px 16px",fontSize:13,color:C.light,marginBottom:24}}>
        💡 O <strong>Método Karvonen</strong> usa sua FC de repouso + FC máxima real para calcular zonas mais precisas.
      </div>
      <div style={{display:"flex",gap:10}}>
        <button style={{...s.btn("ghost"),flex:1}} onClick={onBack}>← Voltar</button>
        <button style={{...s.btn("primary"),flex:2}} onClick={onNext}>Enviar ao Professor →</button>
      </div>
    </div>
  );
}

// ─── STEP 4: MEUS TREINOS ────────────────────────────────────
function StepTreinos({aluno,teste,treinos,session,progresso,setProgresso,notify,onSyncProgress}){
  const [activeWeek,setActiveWeek]=useState(0);
  const [showUpload,setShowUpload]=useState(null);
  const [stravaUrl,setStravaUrl]=useState("");
  const [uploadNote,setUploadNote]=useState("");
  const [saving,setSaving]=useState(false);

  const zoneColor={Z1:C.green,Z2:"#3498DB",Z3:C.yellow,Z4:C.red,Z5:C.purple,Misto:C.orange};
  const tipoEmoji={corrida:"🏃",descanso:"😴",ativo:"🚶"};
  const treinoKey=(si,ti)=>`${si}_${ti}`;

  const marcarConcluido=async(si,ti)=>{
    const key=treinoKey(si,ti);
    const novo={...progresso};
    if(novo[key]?.concluido){ delete novo[key].concluido; delete novo[key].concluidoEm; }
    else{ novo[key]={...(novo[key]||{}),concluido:true,concluidoEm:new Date().toISOString()}; }
    setProgresso(novo);
    await onSyncProgress(novo);
    notify(novo[key]?.concluido?"✅ Treino marcado como concluído!":"Treino desmarcado.","success");
  };

  const salvarComprovacao=async(si,ti)=>{
    if(!stravaUrl.trim()&&!uploadNote.trim()){notify("Adicione um link ou observação.","error");return;}
    setSaving(true);
    const key=treinoKey(si,ti);
    const novo={...progresso};
    novo[key]={...(novo[key]||{}),strava:stravaUrl.trim(),nota:uploadNote.trim(),comprovadoEm:new Date().toISOString()};
    setProgresso(novo);
    await onSyncProgress(novo);
    setShowUpload(null); setStravaUrl(""); setUploadNote("");
    notify("📎 Comprovação enviada ao professor!","success");
    setSaving(false);
  };

  const total=treinos?.semanas?.reduce((acc,s)=>acc+s.treinos.filter(t=>t.tipo!=="descanso").length,0)||0;
  const concluidos=Object.values(progresso).filter(v=>v.concluido).length;

  if(!treinos){
    return(
      <div className="fade-in">
        <h2 style={{fontFamily:"'Syne',sans-serif",fontSize:"clamp(26px,6vw,38px)",fontWeight:800,lineHeight:1.1,marginBottom:8}}>
          Meus <span style={{color:C.orange}}>Treinos</span>
        </h2>
        <div style={s.card({background:"rgba(46,204,113,.06)",borderColor:"rgba(46,204,113,.3)",marginBottom:20,padding:24})}>
          <div style={{display:"flex",alignItems:"center",gap:12,marginBottom:12}}>
            <div style={{width:40,height:40,borderRadius:20,background:"rgba(46,204,113,.15)",border:"1px solid rgba(46,204,113,.4)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:18}}>✅</div>
            <div>
              <div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:800,color:C.green}}>Dados enviados ao professor!</div>
              <div style={{fontSize:12,color:C.muted,marginTop:2}}>Aguardando liberação do plano de treino</div>
            </div>
          </div>
        </div>
        <div style={s.card({textAlign:"center",padding:"56px 24px"})}>
          <div style={{position:"relative",display:"inline-flex",alignItems:"center",justifyContent:"center",marginBottom:24}}>
            <div style={{width:80,height:80,borderRadius:40,background:"rgba(255,107,53,.1)",border:"1px solid rgba(255,107,53,.25)",display:"flex",alignItems:"center",justifyContent:"center",fontSize:32}}>📋</div>
            <div style={{position:"absolute",top:0,right:0,width:18,height:18,borderRadius:9,background:C.orange,display:"flex",alignItems:"center",justifyContent:"center"}}>
              <div style={{width:8,height:8,borderRadius:4,background:"#fff",animation:"ping 1.5s ease-in-out infinite"}}/>
            </div>
          </div>
          <div style={{fontFamily:"'Syne',sans-serif",fontSize:22,fontWeight:800,marginBottom:8}}>Aguardando seu professor</div>
          <div style={{fontSize:14,color:C.light,lineHeight:1.6,maxWidth:340,margin:"0 auto 16px"}}>
            Seu professor está analisando seus dados e criando um plano personalizado de 4 semanas.
          </div>
          <div style={{fontSize:12,color:C.muted,background:"rgba(255,107,53,.07)",border:"1px solid rgba(255,107,53,.2)",borderRadius:8,padding:"10px 16px",display:"inline-block"}}>
            ⏱ O plano costuma ser liberado em alguns minutos
          </div>
        </div>
      </div>
    );
  }

  return(
    <div className="fade-in">
      <h2 style={{fontFamily:"'Syne',sans-serif",fontSize:"clamp(26px,6vw,38px)",fontWeight:800,lineHeight:1.1,marginBottom:8}}>
        Meus <span style={{color:C.orange}}>Treinos</span>
      </h2>
      <div style={s.card({background:"rgba(46,204,113,.06)",borderColor:"rgba(46,204,113,.3)",marginBottom:20,padding:"16px 20px"})}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:8}}>
          <div style={{fontSize:13,fontWeight:700,color:C.green}}>🎉 Plano liberado pelo professor!</div>
          <div style={{fontSize:13,fontWeight:800,color:C.green}}>{concluidos}/{total} treinos</div>
        </div>
        <div style={{background:"rgba(46,204,113,.15)",borderRadius:20,height:8,overflow:"hidden"}}>
          <div style={{width:`${total>0?(concluidos/total*100):0}%`,height:"100%",background:`linear-gradient(90deg,${C.green},#27AE60)`,borderRadius:20,transition:"width .5s ease"}}/>
        </div>
        <div style={{fontSize:11,color:C.muted,marginTop:6}}>{Math.round(total>0?concluidos/total*100:0)}% concluído</div>
      </div>

      <div style={{display:"flex",gap:8,marginBottom:20,flexWrap:"wrap"}}>
        {treinos.semanas.map((sem,i)=>(
          <button key={i} onClick={()=>setActiveWeek(i)} style={{
            padding:"8px 16px",borderRadius:20,border:`1px solid ${activeWeek===i?C.orange:C.border}`,
            background:activeWeek===i?"rgba(255,107,53,.15)":C.card,
            color:activeWeek===i?C.orange:C.muted,cursor:"pointer",fontFamily:"inherit",fontSize:12,fontWeight:700}}>
            Semana {sem.numero}
          </button>
        ))}
      </div>

      {treinos.semanas[activeWeek]&&(
        <div>
          <div style={s.card({background:"rgba(255,107,53,.05)",borderColor:"rgba(255,107,53,.2)",marginBottom:16})}>
            <div style={{fontFamily:"'Syne',sans-serif",fontSize:22,fontWeight:800}}>
              Semana {treinos.semanas[activeWeek].numero} — {treinos.semanas[activeWeek].titulo}
            </div>
            <div style={{fontSize:13,color:C.muted,marginTop:4}}>{treinos.semanas[activeWeek].foco}</div>
          </div>

          {treinos.semanas[activeWeek].treinos.map((t,ti)=>{
            const key=treinoKey(activeWeek,ti);
            const prog=progresso[key]||{};
            const isConcluido=!!prog.concluido;
            const temComprovacao=!!(prog.strava||prog.nota);
            const isUploadOpen=showUpload&&showUpload.si===activeWeek&&showUpload.ti===ti;
            return(
              <div key={ti} className="slide-in" style={{...s.card({marginBottom:12,
                opacity:t.tipo==="descanso"?.6:1,
                animationDelay:`${ti*.05}s`,
                borderColor:isConcluido?"rgba(46,204,113,.4)":C.border,
                background:isConcluido?"rgba(46,204,113,.05)":C.card})}}>
                <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:10,flexWrap:"wrap"}}>
                  <div style={{flex:1,minWidth:0}}>
                    <div style={{fontSize:10,color:C.muted,textTransform:"uppercase",letterSpacing:"1.5px",marginBottom:4}}>
                      {tipoEmoji[t.tipo]||"📅"} {t.dia}
                      {isConcluido&&<span style={{marginLeft:8,color:C.green}}>✓ Concluído</span>}
                    </div>
                    <div style={{fontFamily:"'Syne',sans-serif",fontSize:18,fontWeight:800}}>{t.titulo||t.tipo}</div>
                  </div>
                  <div style={{display:"flex",gap:6,flexWrap:"wrap",flexShrink:0}}>
                    {t.zona&&t.zona!=="Descanso"&&(
                      <span style={{padding:"4px 10px",borderRadius:20,fontSize:11,fontWeight:700,
                        background:`${zoneColor[t.zona]||C.orange}22`,color:zoneColor[t.zona]||C.orange,
                        border:`1px solid ${zoneColor[t.zona]||C.orange}44`}}>{t.zona}</span>
                    )}
                    {t.duracao&&<span style={{padding:"4px 10px",borderRadius:20,fontSize:11,fontWeight:700,
                      background:"rgba(75,123,255,.12)",color:C.blue,border:"1px solid rgba(75,123,255,.25)"}}>{t.duracao}</span>}
                  </div>
                </div>

                {t.fc_alvo&&t.tipo!=="descanso"&&(
                  <div style={{fontSize:12,color:C.muted,marginTop:8,display:"flex",gap:16,flexWrap:"wrap"}}>
                    <span>🫀 FC Alvo: <strong style={{color:C.orange}}>{t.fc_alvo}</strong></span>
                    {t.pace_base&&<span>⏱ Pace: <strong style={{color:C.blue}}>{t.pace_base}</strong></span>}
                  </div>
                )}

                {t.tipo!=="descanso"&&(t.aquecimento||t.principal||t.desaquecimento)&&(
                  <div style={{marginTop:14,display:"flex",flexDirection:"column",gap:8}}>
                    {t.aquecimento&&<div style={{background:"rgba(75,123,255,.07)",border:"1px solid rgba(75,123,255,.2)",borderRadius:8,padding:"10px 12px",fontSize:12,color:C.light}}><strong style={{color:C.blue}}>🔵 Aquecimento: </strong>{t.aquecimento}</div>}
                    {t.principal&&<div style={{background:"rgba(255,107,53,.08)",border:"1px solid rgba(255,107,53,.2)",borderRadius:8,padding:"10px 12px",fontSize:12,color:C.light}}><strong style={{color:C.orange}}>🟠 Principal: </strong>{t.principal}</div>}
                    {t.desaquecimento&&<div style={{background:"rgba(46,204,113,.07)",border:"1px solid rgba(46,204,113,.2)",borderRadius:8,padding:"10px 12px",fontSize:12,color:C.light}}><strong style={{color:C.green}}>🟢 Desaquecimento: </strong>{t.desaquecimento}</div>}
                  </div>
                )}

                {/* Comprovação salva */}
                {temComprovacao&&(
                  <div style={{marginTop:10,background:"rgba(75,123,255,.07)",border:"1px solid rgba(75,123,255,.2)",borderRadius:8,padding:"9px 12px",fontSize:12,color:C.light}}>
                    <div style={{fontWeight:700,color:C.blue,marginBottom:4}}>📎 Comprovação registrada — visível para o professor</div>
                    {prog.strava&&<div>🔗 <a href={prog.strava} target="_blank" rel="noopener noreferrer" style={{color:C.blue}}>{prog.strava.length>50?prog.strava.slice(0,50)+"...":prog.strava}</a></div>}
                    {prog.nota&&<div style={{marginTop:4}}>📝 {prog.nota}</div>}
                  </div>
                )}

                {t.tipo!=="descanso"&&(
                  <div style={{display:"flex",gap:8,marginTop:12,flexWrap:"wrap"}}>
                    <button onClick={()=>marcarConcluido(activeWeek,ti)} style={{...s.btn(isConcluido?"ghost":"success"),flex:1,padding:"9px 12px",fontSize:12}}>
                      {isConcluido?"↩ Desmarcar":"✅ Marcar concluído"}
                    </button>
                    <button onClick={()=>setShowUpload(isUploadOpen?null:{si:activeWeek,ti})} style={{...s.btn("ghost"),padding:"9px 12px",fontSize:12}}>
                      📎 {temComprovacao?"Editar":"Adicionar comprovação"}
                    </button>
                  </div>
                )}

                {isUploadOpen&&(
                  <div style={{marginTop:12,padding:14,background:C.surface,borderRadius:10,border:`1px solid ${C.border}`,animation:"fadeIn .2s ease"}}>
                    <div style={{fontSize:11,fontWeight:700,color:C.muted,textTransform:"uppercase",letterSpacing:1,marginBottom:10}}>
                      📎 Comprovação — será visível ao seu professor
                    </div>
                    <div style={{marginBottom:10}}>
                      <Field label="Link do Strava / Garmin Connect" hint="Cole aqui o link da atividade">
                        <Inp placeholder="https://www.strava.com/activities/..." value={stravaUrl} onChange={e=>setStravaUrl(e.target.value)}/>
                      </Field>
                    </div>
                    <div style={{marginBottom:12}}>
                      <Field label="Observações do treino">
                        <textarea value={uploadNote} onChange={e=>setUploadNote(e.target.value)}
                          placeholder="Como foi o treino? Pace real, sensações, dificuldades..."
                          style={{...s.input,resize:"vertical",minHeight:70,fontSize:13}}/>
                      </Field>
                    </div>
                    <div style={{display:"flex",gap:8}}>
                      <button style={{...s.btn("ghost"),flex:1,padding:"9px",fontSize:12}} onClick={()=>setShowUpload(null)}>Cancelar</button>
                      <button style={{...s.btn("primary"),flex:2,padding:"9px",fontSize:12}} onClick={()=>salvarComprovacao(activeWeek,ti)} disabled={saving}>
                        {saving?"⏳ Enviando...":"💾 Enviar ao professor"}
                      </button>
                    </div>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      )}

      {treinos.analise&&(
        <div style={{marginTop:28}}>
          <div style={{fontSize:10,fontWeight:700,letterSpacing:"2px",textTransform:"uppercase",color:C.muted,marginBottom:12}}>Análise do Professor</div>
          <div style={s.card({background:C.surface,lineHeight:1.75,fontSize:13,color:C.light,whiteSpace:"pre-wrap"})}>{treinos.analise}</div>
        </div>
      )}

      {treinos.whatsapp&&(
        <div style={{marginTop:20}}>
          <a href={`https://wa.me/${treinos.whatsapp}`} target="_blank" rel="noopener noreferrer"
            style={{...s.btn("success"),display:"flex",width:"100%",textDecoration:"none"}}>
            💬 Falar com o Professor no WhatsApp
          </a>
        </div>
      )}
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────
function App(){
  const [session,setSession]=useState(()=>{
    try{return JSON.parse(localStorage.getItem("runcoach_aluno_session")||"null");}catch{return null;}
  });
  const [record,setRecord]=useState(null);
  const [step,setStep]=useState(0);
  const [completed,setCompleted]=useState(0);
  const [aluno,setAluno]=useState(null);
  const [teste,setTeste]=useState(null);
  const [progresso,setProgresso]=useState({});
  const [notif,setNotif]=useState(null);
  const syncRef=useRef(null);

  const notify=(msg,type="success")=>{setNotif({msg,type});setTimeout(()=>setNotif(null),3500);};

  // Sync loop: puxa dados do bin a cada 4s (leitura pública, sem auth)
  const syncPull = useCallback(async () => {
    if(!session) return;
    try {
      const data = await fbGet(session.dbUrl);
      setRecord(data);

      // Carregar dados próprios do aluno se existirem no bin
      const minhaEntry = data.alunos?.[session.uid];
      if(minhaEntry && !aluno) {
        setAluno(minhaEntry.aluno||null);
        setTeste(minhaEntry.teste||null);
        if(minhaEntry.aluno&&minhaEntry.teste){ setStep(3); setCompleted(3); }
        else if(minhaEntry.aluno){ setStep(1); setCompleted(1); }
      }

      // Carregar progresso do bin (fonte de verdade)
      const progBin = data.progresso?.[session.uid];
      if(progBin) setProgresso(progBin);
    } catch(e){}
  }, [session, aluno]);

  useEffect(()=>{
    if(!session) return;
    syncPull();
    syncRef.current = setInterval(syncPull, 4000);
    return ()=>clearInterval(syncRef.current);
  },[session, syncPull]);

  const treinos = (record && session) ? (record.planos?.[session.uid] || null) : null;

  // Sincroniza progresso do aluno para o Firebase (visível ao professor)
  const onSyncProgressWithKey = async (novoProgresso) => {
    if(!session) return;
    try {
      await fbPatch(session.dbUrl, (latest) => {
        latest.progresso = latest.progresso||{};
        latest.progresso[session.uid] = novoProgresso;
        return latest;
      });
    } catch(e){
      notify("Sincronização offline — dados salvos localmente.","error");
      try{localStorage.setItem("runcoach_progress_offline_"+session.uid,JSON.stringify(novoProgresso));}catch{}
    }
  };

  const onSyncProgress = onSyncProgressWithKey;

  const enviarDadosAoProfessor = async (alunoData, testeData) => {
    if(!session) return;
    try {
      const payload = {aluno:alunoData, teste:testeData, uid:session.uid, nome:session.nome, email:session.email, enviadoEm:new Date().toISOString()};
      await fbPatch(session.dbUrl, (latest) => {
        latest.alunos = latest.alunos||{};
        latest.alunos[session.uid] = payload;
        return latest;
      });
      const updated = await fbGet(session.dbUrl);
      setRecord(updated);
      notify("✅ Dados enviados ao professor!");
    } catch(e){
      notify("Erro ao enviar. Verifique sua conexão.","error");
    }
  };

  const handleAluno=(data)=>{setAluno(data);setStep(1);setCompleted(c=>Math.max(c,1));};
  const handleTeste=(data)=>{setTeste(data);setStep(2);setCompleted(c=>Math.max(c,2));};
  const handleZonas=async()=>{
    await enviarDadosAoProfessor(aluno,teste);
    setStep(3); setCompleted(c=>Math.max(c,3));
  };
  const handleLogout=()=>{setSession(null);setRecord(null);setStep(0);setCompleted(0);setAluno(null);setTeste(null);setProgresso({});};
  const handleConnect=(cfg)=>{setSession(cfg);};

  if(!session) return <ConexaoScreen onConnect={handleConnect}/>;

  // Se ainda não temos o record (carregando)
  const loading = !record;

  return(
    <div style={{background:C.bg,minHeight:"100vh",color:C.text,fontFamily:"'Manrope',sans-serif",padding:"28px 16px 80px"}}>
      <Notify msg={notif?.msg} type={notif?.type}/>
      <div style={{maxWidth:820,margin:"0 auto"}}>
        <Header userName={session.nome} onLogout={handleLogout}/>

        {/* Indicador de sync */}
        {loading&&(
          <div style={{display:"flex",alignItems:"center",gap:8,fontSize:12,color:C.muted,marginBottom:20}}>
            <span style={{display:"inline-block",animation:"spin 1s linear infinite"}}>⚙️</span>
            Conectando ao espaço do professor...
          </div>
        )}

        <StepNav step={step} setStep={(i)=>{if(i<=completed)setStep(i);}} completed={completed}/>
        {step===0&&<StepPerfil initialData={aluno} onNext={handleAluno}/>}
        {step===1&&aluno&&<StepTeste aluno={aluno} initialData={teste} onNext={handleTeste} onBack={()=>setStep(0)}/>}
        {step===2&&aluno&&teste&&<StepZonas aluno={aluno} teste={teste} onNext={handleZonas} onBack={()=>setStep(1)}/>}
        {step===3&&aluno&&teste&&(
          <StepTreinos aluno={aluno} teste={teste} treinos={treinos} session={session}
            progresso={progresso} setProgresso={setProgresso} notify={notify}
            onSyncProgress={onSyncProgressWithKey}/>
        )}
      </div>
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById("root"));
root.render(<App/>);
</script>
</body>
</html>
